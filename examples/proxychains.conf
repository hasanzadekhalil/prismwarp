# ==============================================================================
# PrismWarp Proxychains-ng Configuration Snippet
# Place in /etc/proxychains.conf or ~/.proxychains/proxychains.conf
# ==============================================================================

strict_chain
proxy_dns
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
# Route through local PrismWarp instances
# (Uncomment the desired port or use random_chain)
socks5 127.0.0.1 40001
# socks5 127.0.0.1 40002
# socks5 127.0.0.1 40003
